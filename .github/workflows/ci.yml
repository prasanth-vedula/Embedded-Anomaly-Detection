name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python and integration tests
        run: python -m pytest tests/python tests/integration -v

      - name: Configure embedded build
        run: cmake -S embedded -B build/embedded -DCMAKE_BUILD_TYPE=Release

      - name: Build embedded target
        run: cmake --build build/embedded --config Release

      - name: Run embedded tests
        run: ctest --test-dir build/embedded --output-on-failure
